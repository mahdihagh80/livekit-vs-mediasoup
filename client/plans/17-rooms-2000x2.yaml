# 4000 one-to-one rooms split over TWO generators: run this plan on both at the
# same time, each with its own loadgen.name_prefix (g1-, g2-). Each generator
# makes 2000 rooms x 2 participants, both publish (audio + simulcast video) and
# each subscribes to the other.
#
# Per generator: 4000 producers, upload ≈ 8.3 Gbps, download ≈ 2.4 Gbps.
# Total at the SFU: ~16.6 Gbps in, ~4.8 Gbps out.
# Timeline: 15 s baseline + join + 10 min hold + disconnect + 15 s ≈ 12 min.
name: rooms-2000x2
rooms: 2000
maxParticipants: 2
publishers: 2
audio: true
video: true
add: 2            # one step: everyone joins at once
every: 10m
hold: 10m
# Layer each participant subscribes to (% of participants, must sum to 100).
subscribe: {high: 20, medium: 50, low: 30}
