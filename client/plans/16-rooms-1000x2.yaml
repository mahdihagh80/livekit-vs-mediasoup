# 2000 one-to-one rooms split over TWO generators: run this plan on both at the
# same time, each with its own loadgen.name_prefix (g1-, g2-). Each generator
# makes 1000 rooms x 2 participants, both publish (audio + simulcast video) and
# each subscribes to the other.
#
# Per generator: 2000 producers, upload ≈ 4.1 Gbps, download ≈ 1.2 Gbps.
# Total at the SFU: ~8.3 Gbps in, ~2.4 Gbps out (2/3 of 15-rooms-1500x2).
# Timeline: 15 s baseline + join + 10 min hold + disconnect + 15 s ≈ 12 min.
name: rooms-1000x2
rooms: 1000
maxParticipants: 2
publishers: 2
audio: true
video: true
add: 2            # one step: everyone joins at once
every: 10m
hold: 10m
# Layer each participant subscribes to (% of participants, must sum to 100).
subscribe: {high: 20, medium: 50, low: 30}
