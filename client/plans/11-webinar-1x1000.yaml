# One webinar room: 1 publisher (audio + simulcast video) and 1000 subscribers,
# all joined in one step and held for 5 minutes.
#
# Timeline: 15 s baseline + join (1001 at max_inflight_joins) + 5 min hold
#           + disconnect + 15 s before the report  ≈ 6 min.
# Load: generator upload ≈ 2.1 Mbps (one publisher).
#       generator download ≈ 1000 x (~0.55 Mbps video at the 20/50/30 mix + audio) ≈ 600 Mbps.
# mediasoup: router_max_peers 200 -> the room spreads over ~5 routers/workers with pipes.
name: webinar-1x1000
rooms: 1
maxParticipants: 1001
publishers: 1
audio: true
video: true
add: 1001         # one step: everyone joins at once
every: 5m
hold: 5m
# Layer each participant subscribes to (% of participants, must sum to 100).
subscribe: {high: 20, medium: 50, low: 30}
