# Experiment 5: one webinar room, 3 publishers and 5,000 subscribers, for the pacer comparison
# (as plans/78 does for group calls and plans/79 for 1:1 calls).
# The 3 publishers send audio (as audio/red) + VP9 SVC in two spatial layers (180p 150 kbps +
# 360p 400 kbps); every subscriber receives 3 videos and 3 audio tracks.
# Uneven ramp (plan key `steps`): 1,503 people in the first minute (3 publishers + 1,500 subscribers),
# then +1,500, +1,000, +1,000: 1,500 / 3,000 / 4,000 / 5,000 subscribers, then 2 minutes at 5,000.
# The room is shared between the two generators (shared_rooms, shards 1/2 and 2/2): gen-1 runs
# the publishers and half the subscribers, gen-2 the other half, 20 s later.
# Run three times with only LiveKit's send path changed:
#   wbr     default no-queue pacer
#   wbrpt   send_side_bwe_pacer: pass-through
#   wbrptb  pass-through + rtc.batch_io (batch_size 32, max_flush_interval 1ms)
# LiveKit and NIC layout as plans/78: 92 logical CPUs, 92 UDP mux ports, IRQs on CPUs 0-15.
# Step timing (60 s steps): light profiles from +40 s, heavy from +50 s; the steady numbers are read
# from the second minute at 5,000 subscribers. Timeline: 15 s baseline + 3 x 1 min + 2 min hold + leave ≈ 6 min.
name: x5-wb-5000-red
red: true
codec: vp9
rooms: 1
maxParticipants: 5003
publishers: 3
audio: true
video: true
steps: [1503, 1500, 1000, 1000]
every: 1m
hold: 2m
subscribe: {high: 20, medium: 50, low: 30}
networkTarget: all
network:
  - {name: clean, percent: 40}
  - {name: mobile, percent: 15, delay: 60ms, jitter: 20ms, loss: 1}
  - {name: dippy, percent: 15, dip: {kbps: 300, for: 15s, every: 1m}}
  - {name: capped, percent: 10, kbps: 1000}
  - {name: burst, percent: 10, burst: {loss: 5, length: 50ms}}
  - {name: far, percent: 10, delay: 150ms, jitter: 30ms}
