# One webinar room: 3 publishers (audio + simulcast video) and 3000 subscribers,
# all joined in one step and held for 10 minutes.
#
# Timeline: 15 s baseline + join (3003 at max_inflight_joins) + 10 min hold
#           + disconnect + 15 s before the report  ≈ 12 min.
# Load: every subscriber receives all 3 publishers -> ~9000 video + ~9000 audio tracks.
#       generator download ≈ 3000 x 3 x (~0.55 Mbps video at the 20/50/30 mix + audio) ≈ 5 Gbps.
# mediasoup: router_max_peers 200 -> the room spreads over ~16 routers/workers with pipes.
name: webinar-3x3000
rooms: 1
maxParticipants: 3003
publishers: 3
audio: true
video: true
add: 3003         # one step: everyone joins at once
every: 10m
hold: 10m
# Layer each participant subscribes to (% of participants, must sum to 100).
subscribe: {high: 20, medium: 50, low: 30}
