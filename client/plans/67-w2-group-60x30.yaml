# W2b, group call at 60 rooms (rerun): same as 61-w2-group-80x30.yaml but
# 60 rooms x 30, 6 video publishers per room (audio + VP9 SVC L3T1); the other 24 only subscribe.
# Split over TWO generators in isolated mode (name_prefix g1-, g2-); each runs 30 rooms, so the
# fleet is 1800 participants / 360 producers.
#
# Per generator: 180 producers (upload ≈ 0.38 Gbps), 5220 video subscriptions
# (24x6 + 6x5 per room x 30) ≈ 0.73 Mbps each (download ≈ 3.8 Gbps + audio).
# SFU total ≈ 0.75 Gbps in, 7.5 Gbps out. Why 60: at 80 rooms LiveKit ran out of CPU (55.9 cores,
# CPUs 14-63 at 98.7 %); 60 rooms should leave it headroom. mediasoup media.tuned.50p.yaml
# (capacity scheduler).
# Timeline: 15 s baseline, one step (everyone queued at once, publishers
# first in each room, paced by loadgen.max_inflight_joins), hold 9 min, leave.
# Needs report.warmup: 120s in bench.yaml so the measured window is [2:00, 9:00] = 7 min.
name: w2-group-60x30
codec: vp9
rooms: 30
maxParticipants: 30
publishers: 6
audio: true
video: true
add: 30           # one step: everyone joins
every: 9m
hold: 9m
subscribe: {high: 20, medium: 50, low: 30}
# Network mix. networkTarget all: everyone's SUBSCRIBE
# connection (SFU -> person) gets a profile by position, publishers included; publish
# connections stay clean both ways. Same people impaired on both SFUs.
networkTarget: all
network:
  - {name: clean, percent: 40}
  - {name: mobile, percent: 15, delay: 60ms, jitter: 20ms, loss: 1}
  - {name: dippy, percent: 15, dip: {kbps: 300, for: 15s, every: 1m}}
  - {name: capped, percent: 10, kbps: 1000}
  - {name: burst, percent: 10, burst: {loss: 5, length: 50ms}}
  - {name: far, percent: 10, delay: 150ms, jitter: 30ms}
